name: Siteyi yayınla

# Ana dala her gönderimde veriyi doğrular ve siteyi GitHub Pages'e yayınlar.
# Yayınlanan kopyada hassas alanlar (fiyat, satıcı, seri no, güncel değer)
# scripts/build.mjs tarafından silinir — bkz. data/README.md.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Veriyi doğrula
        run: node scripts/validate-data.mjs

      - name: Siteyi derle
        run: node scripts/build.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
