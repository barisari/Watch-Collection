<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saat Koleksiyonum</title>
  <meta name="description" content="Saat koleksiyonu envanteri, teknik özellikler ve rotasyon günlüğü.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⌚</text></svg>">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">İçeriğe atla</a>

  <header class="site-header">
    <div class="wrap header-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">⌚</span>
        <span class="brand-text">
          <span class="brand-title" data-bind="collectionName">Saat Koleksiyonum</span>
          <span class="brand-tagline" data-bind="tagline"></span>
        </span>
      </div>

      <div class="header-actions">
        <button type="button" class="btn btn-ghost" id="mode-toggle"
                aria-pressed="false" title="Satın alma fiyatı, değer ve seri numarası alanlarını göster/gizle">
          <span class="dot" aria-hidden="true"></span>
          <span id="mode-label">Herkese açık</span>
        </button>
        <button type="button" class="btn btn-icon" id="theme-toggle" aria-label="Açık/koyu tema">
          <span aria-hidden="true">◐</span>
        </button>
      </div>
    </div>

    <nav class="tabs wrap" aria-label="Bölümler">
      <a href="#/koleksiyon" data-route="koleksiyon">Koleksiyon</a>
      <a href="#/takvim"     data-route="takvim">Takvim</a>
      <a href="#/istatistik" data-route="istatistik">İstatistik</a>
      <a href="#/kayit"      data-route="kayit">Kayıt ekle</a>
    </nav>
  </header>

  <main id="main" class="wrap" tabindex="-1">
    <div id="view" aria-live="polite"></div>
  </main>

  <footer class="site-footer wrap">
    <p>
      <span data-bind="watchCount"></span> saat ·
      <span data-bind="wearCount"></span> rotasyon kaydı ·
      veri kaynağı <code>data/watches.json</code> &amp; <code>data/wears.json</code>
    </p>
    <p class="muted" id="draft-status"></p>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
